<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienestar Joven | Tu Espacio Seguro</title>
    
    <!-- SCRIPT OFICIAL DE GOOGLE (Necesario para que el login funcione) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Indie+Flower&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { --primary: #6366F1; --bg: #F8FAFC; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.5); }
        .notebook {
            background: #fff;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 2rem;
            padding: 2rem 1rem 2rem 3.5rem;
            border-left: 5px double #f87171;
            font-family: 'Indie Flower', cursive;
            min-height: 250px;
        }
        .hidden-section { display: none; }
        .pet-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <!-- PANTALLA 1: LOGIN REAL DE GOOGLE -->
    <section id="screen-login" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-4xl font-bold text-indigo-600 mb-2">Bienestar Joven</h1>
        <p class="text-slate-500 mb-8">Inicia sesión para guardar tu progreso y mascota.</p>
        
        <div class="glass p-10 w-full max-w-sm flex flex-col items-center">
            <!-- BOTÓN REAL DE GOOGLE -->
            <div id="g_id_onload"
                 data-client_id="243954968566-k2vto5058tm7pib4pq5c874n2oj0nerg.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
            
            <p class="text-[10px] text-slate-400 mt-6 italic">Tu información está protegida por Google y Bienestar Joven.</p>
        </div>
    </section>

    <!-- PANTALLA 2: REGISTRO DE PERFIL (Solo la primera vez) -->
    <section id="screen-onboarding" class="hidden-section max-w-md mx-auto p-6 pt-10">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">¡Casi listo! 🌟</h2>
        <div class="glass p-6 space-y-4">
            <div class="text-center mb-4">
                <img id="user-photo" src="" class="w-20 h-20 rounded-full mx-auto border-4 border-white shadow-md">
                <p id="user-email" class="text-[10px] text-slate-400 mt-2"></p>
            </div>
            <div>
                <label class="text-[10px] font-bold opacity-50 uppercase">Nombre para la mascota</label>
                <input type="text" id="reg-nombre" class="w-full p-3 rounded-xl border mt-1 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold opacity-50 uppercase">Edad (12-17)</label>
                    <input type="number" id="reg-edad" min="12" max="17" class="w-full p-3 rounded-xl border mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold opacity-50 uppercase">Sexo</label>
                    <select id="reg-sexo" class="w-full p-3 rounded-xl border mt-1">
                        <option>Femenino</option><option>Masculino</option><option>Otro</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold opacity-50 uppercase">Elige tu mascota</label>
                <select id="reg-pet" class="w-full p-3 rounded-xl border mt-1">
                    <option value="🐶">Perro</option><option value="🐱">Gato</option><option value="🐼">Panda</option><option value="🐰">Conejo</option>
                </select>
            </div>
            <button onclick="finishRegistration()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold mt-4">Entrar a mi espacio</button>
        </div>
    </section>

    <!-- NAVEGACIÓN Y CONTENIDO (Oculto hasta loguearse) -->
    <nav id="main-nav" class="hidden-section fixed bottom-0 left-0 w-full bg-white/90 border-t p-4 z-50 md:top-0 md:bottom-auto">
        <div class="max-w-4xl mx-auto flex justify-around items-center text-[10px] font-bold uppercase">
            <button onclick="showScreen('inicio')">🏠 Inicio</button>
            <button onclick="showScreen('actividades')">🌟 Misiones</button>
            <button onclick="showScreen('metas')">🎯 Metas</button>
            <button onclick="showScreen('diario')">📖 Diario</button>
            <button onclick="showScreen('progreso')">📈 Avance</button>
        </div>
    </nav>

    <main id="app-content" class="hidden-section max-w-xl mx-auto p-6 pt-6 pb-28 md:pt-24">
        <!-- PANTALLA INICIO -->
        <section id="screen-inicio" class="text-center fade-in">
            <div class="glass p-6 mb-6">
                <div id="pet-display" class="text-7xl pet-bounce mb-2">🐶</div>
                <h3 class="font-bold">¡Hola, <span id="display-name"></span>!</h3>
                <p class="text-xs text-slate-500">Tu racha: <span id="racha-val">0</span> días 🔥</p>
            </div>
            <p id="frase-dinamica" class="italic text-slate-400 text-sm mb-6"></p>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showScreen('actividades')" class="p-6 glass bg-indigo-50 border-indigo-200">
                    <p class="text-xs font-bold text-indigo-600">Hacer misiones</p>
                </button>
                <button onclick="showScreen('diario')" class="p-6 glass bg-rose-50 border-rose-200">
                    <p class="text-xs font-bold text-rose-600">Escribir diario</p>
                </button>
            </div>
        </section>

        <!-- DIARIO TIPO CUADERNO -->
        <section id="screen-diario" class="hidden-section fade-in">
            <h2 class="text-2xl font-bold mb-4">Mi Cuaderno Privado</h2>
            <div class="notebook mb-4">
                <p class="text-[10px] font-bold text-red-400 mb-2" id="fecha-diario"></p>
                <textarea id="texto-diario" class="w-full bg-transparent border-none outline-none resize-none" rows="8" placeholder="Escribe aquí tus sentimientos..."></textarea>
            </div>
            <button onclick="savePage()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg">Guardar página</button>
            
            <div id="historial-diario" class="mt-10 space-y-4">
                <!-- Páginas anteriores aparecerán aquí -->
            </div>
        </section>
        
        <!-- Otras secciones irían aquí (Metas, Progreso, etc.) -->
    </main>

    <script>
        let userData = JSON.parse(localStorage.getItem('bj_user_data')) || null;

        // 1. MANEJAR RESPUESTA DE GOOGLE
        function handleCredentialResponse(response) {
            // Decodificar el token de Google para obtener info del usuario
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(window.atob(base64));

            console.log("Usuario de Google:", payload);

            if (userData && userData.email === payload.email) {
                loginSuccess();
            } else {
                // Es un usuario nuevo o no hay datos
                document.getElementById('screen-login').classList.add('hidden-section');
                document.getElementById('screen-onboarding').classList.remove('hidden-section');
                document.getElementById('user-photo').src = payload.picture;
                document.getElementById('user-email').innerText = payload.email;
                document.getElementById('reg-nombre').value = payload.given_name;
                
                userData = { email: payload.email, foto: payload.picture, racha: 0, diario: [] };
            }
        }

        function finishRegistration() {
            userData.nombre = document.getElementById('reg-nombre').value;
            userData.edad = document.getElementById('reg-edad').value;
            userData.pet = document.getElementById('reg-pet').value;
            localStorage.setItem('bj_user_data', JSON.stringify(userData));
            loginSuccess();
        }

        function loginSuccess() {
            document.getElementById('screen-login').classList.add('hidden-section');
            document.getElementById('screen-onboarding').classList.add('hidden-section');
            document.getElementById('main-nav').classList.remove('hidden-section');
            document.getElementById('app-content').classList.remove('hidden-section');
            
            document.getElementById('display-name').innerText = userData.nombre;
            document.getElementById('pet-display').innerText = userData.pet;
            document.getElementById('racha-val').innerText = userData.racha;
            showScreen('inicio');
        }

        // 2. LÓGICA DEL DIARIO
        function savePage() {
            const content = document.getElementById('texto-diario').value;
            if(!content) return;
            const entry = { fecha: new Date().toLocaleString(), texto: content };
            userData.diario.unshift(entry);
            localStorage.setItem('bj_user_data', JSON.stringify(userData));
            document.getElementById('texto-diario').value = "";
            renderHistory();
            alert("Página guardada.");
        }

        function renderHistory() {
            const container = document.getElementById('historial-diario');
            container.innerHTML = userData.diario.map(e => `
                <div class="glass p-5 text-sm italic">
                    <p class="text-[10px] font-bold opacity-30">${e.fecha}</p>
                    <p>"${e.texto}"</p>
                </div>
            `).join('');
        }

        function showScreen(id) {
            document.querySelectorAll('main section').forEach(s => s.classList.add('hidden-section'));
            document.getElementById('screen-' + id).classList.remove('hidden-section');
            if(id === 'diario') {
                document.getElementById('fecha-diario').innerText = new Date().toLocaleDateString();
                renderHistory();
            }
        }

        window.onload = () => {
            if(userData) loginSuccess();
        };
    </script>
</body>
</html>
